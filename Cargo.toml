[package]
name = "bevy_copperfield"
description = "Procedural mesh editor, based on Half-Edge-Mesh datastructure"
repository = "https://github.com/Hexorg/bevy_copperfield"
version = "0.2.2"
edition = "2021"
license = "MIT"
readme = "README.md"

[workspace]
resolver = "2"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[dependencies]
glam = "0.30"
bevy_utils = "0.15"
bevy_transform = "0.15"
bevy_math = "0.15"
bevy_render = "0.15"
earcutr = "0.4.3"
itertools = "0.14.0"
line_drawing = "1.0.1"
noise = "0.9.0"
slotmap = "1.0.7"
smallvec = "1.14.0"
sprs = "0.11.3"

[dev-dependencies]
bevy = {version = "0.15", features=["jpeg"]}